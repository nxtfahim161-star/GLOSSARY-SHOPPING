<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1530">
<title>GASS SHOPPING BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;700;800&family=Fraunces:ital,wght@1,600&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="loader.css">
</head>
<body>

<div class="ld" id="loader" role="progressbar" aria-label="Loading" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1">
  <div class="ld-bg"></div>
  <div class="ld-frame" id="ldFrame"><div class="ld-photos" id="ldPhotos"></div><div class="ld-shade"></div></div>
  <div class="ld-hud">
    <div class="ld-glow"><div class="ld-count" id="ldCount"></div></div>
    <div class="ld-label" id="ldLabel">Loading ... 01%</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
    <div class="ld-cap" id="ldCap"></div>
  </div>
</div>

<div class="glow" id="glow"></div>

<header class="nav">
  <a class="logo" href="#" data-act="go" data-v="home">GASS<span>SHOPPING</span>BD</a>
  <div class="mode">
    <button id="mDel" data-act="mode" data-v="delivery">Delivery</button>
    <button id="mPick" data-act="mode" data-v="pickup">Pickup</button>
  </div>
  <button class="pill" data-act="loc">📍 <span id="locText">Gulshan</span> ▾</button>
  <input id="search" class="search" placeholder="Search shops, burger, noodles...">
  <button class="pill" id="ordBtn" data-act="go" data-v="orders">🧾</button>
  <button class="pill" id="langBtn" data-act="lang">বাং</button>
  <button class="pill" id="userBtn" data-act="user">👤</button>
  <button class="cart-btn" id="cartBtn">🛒 <b id="cartCount">0</b></button>
</header>

<div id="view"></div>

<footer>
  <div class="bigtext rv"><span>G</span><span>A</span><span>S</span><span>S</span></div>
  <p>© 2026 GASS SHOPPING BD — Demo project. All products are fake, no real orders.</p>
  <button class="mini" id="hapBtn" data-act="hap">📳 Haptics: On</button>
</footer>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">
  <div class="d-head"><h3 id="cartTitle">Your cart</h3><button data-act="closecart">✕</button></div>
  <div class="d-body" id="cartBody"></div>
  <div class="d-foot" id="cartFoot"></div>
</aside>

<div class="modal" id="modal"></div>

<div class="modal" id="locModal">
  <div class="box">
    <button class="x" data-act="close" data-v="locModal">✕</button>
    <h3>Choose delivery location</h3>
    <div id="locList" class="loc-list"></div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="box">
    <button class="x" data-act="close" data-v="loginModal">✕</button>
    <h3>Login (demo)</h3>
    <input id="lname" class="inp" placeholder="Your name">
    <input id="lphone" class="inp" placeholder="Phone number" inputmode="tel">
    <input id="lotp" class="inp" placeholder="OTP code (demo: 1234)" inputmode="numeric">
    <button class="primary" data-act="login">Verify &amp; continue</button>
  </div>
</div>

<div class="okSheet" id="okSheet">
  <div class="okCard">
    <svg viewBox="0 0 52 52" aria-hidden="true"><circle class="okC" cx="26" cy="26" r="24"/><path class="okT" d="M14 27l8 8 16-18"/></svg>
    <h3>Demo order saved</h3>
    <p>No payment was taken and nothing was sent to a restaurant.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="loader.js"></script>
</body>
  </html>
