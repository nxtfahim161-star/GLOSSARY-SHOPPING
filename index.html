<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GASS SHOPPING BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader" id="loader">
  <div class="ld-emoji" id="ldEmoji">🍔</div>
  <div class="ld-num" id="ldNum">0</div>
  <p>GASS SHOPPING BD</p>
</div>
<div class="curtain" id="curtain"></div>
<div class="glow" id="glow"></div>

<header class="nav">
  <a class="logo" href="#" data-act="go" data-v="home">GASS<span>SHOPPING</span>BD</a>
  <div class="mode">
    <button id="mDel" data-act="mode" data-v="delivery">Delivery</button>
    <button id="mPick" data-act="mode" data-v="pickup">Pickup</button>
  </div>
  <button class="pill" data-act="loc">📍 <span id="locText">Gulshan</span> ▾</button>
  <input id="search" class="search" placeholder="Search shops, burger, battery...">
  <button class="pill" id="ordBtn" data-act="go" data-v="orders">🧾</button>
  <button class="pill" id="langBtn" data-act="lang">বাং</button>
  <button class="pill" id="userBtn" data-act="user">👤</button>
  <button class="cart-btn" id="cartBtn">🛒 <b id="cartCount">0</b></button>
</header>

<div id="view"></div>

<footer>
  <div class="bigtext rv"><span>G</span><span>A</span><span>S</span><span>S</span></div>
  <p>© 2026 GASS SHOPPING BD — Demo project. All products are fake, no real orders.</p>
</footer>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">
  <div class="d-head"><h3 id="cartTitle">Your cart</h3><button data-act="closecart">✕</button></div>
  <div class="d-body" id="cartBody"></div>
  <div class="d-foot" id="cartFoot"></div>
</aside>

<div class="modal" id="modal"></div>

<div class="modal" id="locModal">
  <div class="box">
    <button class="x" data-act="close" data-v="locModal">✕</button>
    <h3>Choose delivery location</h3>
    <div id="locList" class="loc-list"></div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="box">
    <button class="x" data-act="close" data-v="loginModal">✕</button>
    <h3>Login (demo)</h3>
    <input id="lname" class="inp" placeholder="Your name">
    <input id="lphone" class="inp" placeholder="Phone number" inputmode="tel">
    <input id="lotp" class="inp" placeholder="OTP code (demo: 1234)" inputmode="numeric">
    <button class="primary" data-act="login">Verify &amp; continue</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
</body>
                        </html>
