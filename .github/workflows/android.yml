name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p docs
          for f in index.html style.css loader.css data.js core.js loader.js views.js; do
            if [ -f "$f" ]; then cp "$f" docs/; fi
          done
          if [ -d images ]; then cp -r images docs/; fi
          ls -la docs

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gass-shopping-bd.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gass-shopping-bd-apk
          path: gass-shopping-bd.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GASS SHOPPING BD build ${{ github.run_number }}
          files: gass-shopping-bd.apk
